name: Update economic calendar and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. These off-hour runs reduce top-of-hour congestion.
    - cron: "17 5 * * *"
    - cron: "17 13,15,17,21 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate economic calendar
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CALENDAR_HISTORY_DAYS: "365"
          CALENDAR_FUTURE_DAYS: "180"
        shell: bash
        run: |
          if [[ -z "$FRED_API_KEY" ]]; then
            echo "::warning::FRED_API_KEY is not configured; deploying the placeholder calendar."
          else
            python scripts/update_calendar.py
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
