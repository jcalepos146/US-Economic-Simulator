name: Update economic calendar and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
    - cron: "17 13,15,17,21 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify repository files
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository files:"
          find . -maxdepth 4 -type f | sort

          test -f index.html || {
            echo "::error::index.html is missing from the repository root."
            exit 1
          }

          test -f scripts/update_calendar.py || {
            echo "::error::scripts/update_calendar.py is missing. The scripts folder must be at the repository root."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate calendar script
        run: python3 -m py_compile scripts/update_calendar.py

      - name: Generate economic calendar
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CALENDAR_HISTORY_DAYS: "365"
          CALENDAR_FUTURE_DAYS: "180"
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${FRED_API_KEY:-}" ]]; then
            echo "::error::The repository secret FRED_API_KEY is missing or empty."
            echo "Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

          python3 scripts/update_calendar.py

          test -s data/economic-calendar.json || {
            echo "::error::The calendar script did not create data/economic-calendar.json."
            exit 1
          }

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/economic-calendar.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          print(f"Calendar generated: {payload.get('eventCount', 0)} events")
          print(f"Generated at: {payload.get('generatedAt', 'unknown')}")
          print(f"Range: {payload.get('range', {})}")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
